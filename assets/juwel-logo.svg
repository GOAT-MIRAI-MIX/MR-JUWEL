<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="JUWEL — MR JUWEL BOT — MIRAI_GOAT_MIX_FORK">
  <title>JUWEL — MR JUWEL BOT — MIRAI_GOAT_MIX_FORK</title>
  <defs>
    <!-- background -->
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#241a52"/>
      <stop offset="55%" stop-color="#0d0f2b"/>
      <stop offset="100%" stop-color="#04050d"/>
    </radialGradient>

    <!-- cycling neon palettes -->
    <linearGradient id="neonA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#7c4dff;#ff2bd6;#00e5ff" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#7c4dff"><animate attributeName="stop-color" values="#7c4dff;#ff2bd6;#00e5ff;#7c4dff" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="neonB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd200"><animate attributeName="stop-color" values="#ffd200;#ff5f6d;#ff2bd6;#ffd200" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#ff5f6d"><animate attributeName="stop-color" values="#ff5f6d;#ff2bd6;#ffd200;#ff5f6d" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="25%" stop-color="#7c4dff"/>
      <stop offset="50%" stop-color="#ff2bd6"/>
      <stop offset="75%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
    <linearGradient id="titleG" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="30%" stop-color="#7c4dff"/>
      <stop offset="60%" stop-color="#ff2bd6"/>
      <stop offset="100%" stop-color="#ffe600"/>
      <animate attributeName="x1" values="0;-0.6;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.4;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hexFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f4d"/>
      <stop offset="100%" stop-color="#090b22"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- filters -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur30" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur14" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>

    <!-- clip for the title shine -->
    <clipPath id="titleClip">
      <text x="480" y="438" text-anchor="middle" font-family="Verdana, 'Arial Black', sans-serif" font-size="92" font-weight="900" letter-spacing="14">JUWEL</text>
    </clipPath>

    <!-- grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c8cff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <!-- reusable hexagon -->
    <polygon id="hex" points="0,-84 73,-42 73,42 0,84 -73,42 -73,-42"/>
  </defs>

  <!-- ═════════ BACKGROUND ═════════ -->
  <rect width="960" height="560" rx="34" fill="url(#bg)"/>
  <rect width="960" height="560" rx="34" fill="url(#grid)"/>

  <!-- drifting aurora blobs -->
  <g>
    <circle cx="200" cy="170" r="130" fill="#00e5ff" opacity="0.28" filter="url(#blur30)">
      <animate attributeName="cx" values="200;260;200" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.38;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="170" r="130" fill="#ff2bd6" opacity="0.28" filter="url(#blur30)">
      <animate attributeName="cx" values="760;700;760" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.38;0.2;0.38" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="470" r="150" fill="#7c4dff" opacity="0.25" filter="url(#blur30)">
      <animate attributeName="opacity" values="0.15;0.32;0.15" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- twinkling stars -->
  <g fill="#fff">
    <circle cx="64"  cy="64"  r="2.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="896" cy="72"  r="2.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="34"  r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="320" r="2.4"><animate attributeName="opacity" values="1;0.1;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="80"  cy="330" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="52"  r="1.8"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="50"  r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="520" r="2"><animate attributeName="opacity" values="1;0.1;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="515" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- frame -->
  <rect x="4" y="4" width="952" height="552" rx="32" fill="none" stroke="url(#neonA)" stroke-width="2.5" opacity="0.85"/>

  <!-- ═════════ ENERGY LINK ═════════ -->
  <g>
    <line x1="340" y1="190" x2="620" y2="190" stroke="url(#rainbow)" stroke-width="4" stroke-opacity="0.35" filter="url(#glow)"/>
    <line x1="340" y1="190" x2="620" y2="190" stroke="#fff" stroke-width="2.5" stroke-dasharray="4 14" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <circle r="5" fill="#fff" filter="url(#glow)">
      <animate attributeName="cx" values="340;620;340" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="190;190;190" dur="3s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(480,190)">
      <rect x="-24" y="-24" width="48" height="48" rx="10" transform="rotate(45)" fill="#0b0e24" stroke="url(#neonA)" stroke-width="3.5" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" values="45;135;225;315;405" dur="10s" repeatCount="indefinite"/>
      </rect>
      <text y="10" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="30" font-weight="900" fill="#fff">×</text>
    </g>
  </g>

  <!-- ═════════ LEFT: MIRAI (floats up/down) ═════════ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,-10;0,10;0,-10" dur="4.2s" repeatCount="indefinite"/>
    <g transform="translate(200,190)">
      <!-- glow -->
      <circle r="105" fill="url(#neonA)" opacity="0.35" filter="url(#blur14)"/>
      <!-- outer segmented ring -->
      <circle r="112" fill="none" stroke="url(#neonA)" stroke-width="5" stroke-dasharray="26 12" stroke-linecap="round" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="100" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
      </circle>
      <!-- orbiting spark -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
        <circle cx="112" cy="0" r="6" fill="#fff" filter="url(#glow)"/>
      </g>
      <!-- hexagon body -->
      <use href="#hex" fill="url(#hexFill)" stroke="url(#neonA)" stroke-width="6" filter="url(#glow)"/>
      <use href="#hex" fill="url(#glass)"/>
      <polygon points="0,-66 57,-33 57,33 0,66 -57,33 -57,-33" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1.5"/>
      <!-- stylised M -->
      <path d="M -38 34 L -38 -26 L 0 12 L 38 -26 L 38 34" fill="none" stroke="url(#neonA)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <path d="M -38 34 L -38 -26 L 0 12 L 38 -26 L 38 34" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- circuit nodes -->
      <g fill="#fff">
        <circle cx="-38" cy="-26" r="5"/><circle cx="38" cy="-26" r="5"/><circle cx="0" cy="12" r="5"/>
      </g>
      <!-- rising star -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="2s" repeatCount="indefinite"/>
        <path d="M0 -58 L5 -46 L18 -44 L8 -35 L11 -22 L0 -29 L-11 -22 L-8 -35 L-18 -44 L-5 -46 Z" transform="translate(0,2) scale(0.9)" fill="#ffe600" filter="url(#glow)"/>
      </g>
    </g>
    <text x="200" y="344" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="10" fill="#8fe9ff">MIRAI</text>
  </g>

  <!-- ═════════ RIGHT: GOAT (floats opposite phase) ═════════ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,10;0,-10;0,10" dur="4.2s" repeatCount="indefinite"/>
    <g transform="translate(760,190)">
      <circle r="105" fill="url(#neonB)" opacity="0.35" filter="url(#blur14)"/>
      <circle r="112" fill="none" stroke="url(#neonB)" stroke-width="5" stroke-dasharray="26 12" stroke-linecap="round" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="100" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
        <circle cx="112" cy="0" r="6" fill="#fff" filter="url(#glow)"/>
      </g>
      <use href="#hex" fill="url(#hexFill)" stroke="url(#neonB)" stroke-width="6" filter="url(#glow)"/>
      <use href="#hex" fill="url(#glass)"/>
      <polygon points="0,-66 57,-33 57,33 0,66 -57,33 -57,-33" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1.5"/>

      <!-- goat head (original mark) -->
      <g filter="url(#glow)">
        <!-- horns -->
        <path d="M -17 -26 C -46 -38 -52 -66 -30 -72 C -40 -58 -30 -48 -12 -44" fill="url(#neonA)"/>
        <path d="M  17 -26 C  46 -38  52 -66  30 -72 C  40 -58  30 -48  12 -44" fill="url(#neonA)"/>
        <!-- ears -->
        <path d="M -24 -14 L -54 -22 L -30 -2 Z" fill="url(#neonB)"/>
        <path d="M  24 -14 L  54 -22 L  30 -2 Z" fill="url(#neonB)"/>
        <!-- face -->
        <path d="M -26 -32 Q 0 -44 26 -32 L 22 6 Q 20 22 10 30 L -10 30 Q -20 22 -22 6 Z" fill="url(#neonB)"/>
        <!-- beard -->
        <path d="M -9 30 L 0 56 L 9 30 Z" fill="url(#neonB)"/>
      </g>
      <!-- face details -->
      <path d="M -17 -12 L -6 -8 L -17 -4 Z" fill="#090b22"/>
      <path d="M  17 -12 L  6 -8 L  17 -4 Z" fill="#090b22"/>
      <circle cx="-4" cy="22" r="2.4" fill="#090b22"/><circle cx="4" cy="22" r="2.4" fill="#090b22"/>
      <path d="M -14 -30 Q 0 -38 14 -30" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="760" y="344" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="10" fill="#ffd98f">GOAT</text>
  </g>

  <!-- ═════════ TITLE ═════════ -->
  <text x="480" y="438" text-anchor="middle" font-family="Verdana, 'Arial Black', sans-serif" font-size="92" font-weight="900" letter-spacing="14" fill="url(#titleG)" filter="url(#glow)">JUWEL</text>
  <!-- moving shine across the title -->
  <g clip-path="url(#titleClip)">
    <rect x="-200" y="350" width="120" height="110" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-200;1100" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="480" y="478" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="12" fill="url(#rainbow)">MR JUWEL BOT
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- ═════════ FORK RIBBON ═════════ -->
  <g transform="translate(480,518)">
    <rect x="-210" y="-20" width="420" height="40" rx="20" fill="#0a0c24" stroke="url(#neonA)" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="-210" y="-20" width="420" height="40" rx="20" fill="url(#glass)"/>
    <circle cx="-186" cy="0" r="5" fill="#00e5ff"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="186" cy="0" r="5" fill="#ff2bd6"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/></circle>
    <text y="7" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="21" font-weight="900" letter-spacing="3" fill="#ffffff">MIRAI_GOAT_MIX_FORK</text>
  </g>
</svg>
