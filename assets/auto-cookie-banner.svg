<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="JUWEL CHAT BOT — Auto Cookie — Auto Facebook Login">
  <title>JUWEL CHAT BOT — Auto Cookie • Auto Facebook Login</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#2a1b5e"/>
      <stop offset="55%" stop-color="#0e1030"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#7c4dff;#ff2bd6;#ffd200;#00e5ff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#7c4dff"><animate attributeName="stop-color" values="#7c4dff;#ff2bd6;#ffd200;#00e5ff;#7c4dff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#ff2bd6"><animate attributeName="stop-color" values="#ff2bd6;#ffd200;#00e5ff;#7c4dff;#ff2bd6" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#7c4dff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="cookie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7c873"/>
      <stop offset="100%" stop-color="#c8782a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect x="6" y="6" width="948" height="408" rx="26"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="960" height="420" rx="30" fill="url(#bg)"/>
  <rect width="960" height="420" rx="30" fill="url(#dots)"/>
  <g clip-path="url(#frame)">
    <circle cx="90" cy="60" r="150" fill="#00e5ff" fill-opacity="0.07"/>
    <circle cx="880" cy="360" r="190" fill="#ff2bd6" fill-opacity="0.08"/>
    <circle cx="500" cy="-20" r="120" fill="#7c4dff" fill-opacity="0.10"/>
  </g>

  <!-- neon frame -->
  <rect x="6" y="6" width="948" height="408" rx="26" fill="none" stroke="url(#title)" stroke-width="3" filter="url(#glow)"/>
  <rect x="16" y="16" width="928" height="388" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="3 7"/>

  <!-- left icon : cookie + refresh arrows -->
  <g transform="translate(150 190)" filter="url(#glow)">
    <circle r="86" fill="none" stroke="url(#title)" stroke-width="3" stroke-dasharray="14 10" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="66" fill="url(#cookie)"/>
    <path d="M 40 -52 A 24 24 0 0 0 66 -10 A 66 66 0 0 0 40 -52 Z" fill="#0e1030"/>
    <circle cx="-22" cy="-22" r="8" fill="#5a2d0c"/>
    <circle cx="12" cy="-34" r="6" fill="#5a2d0c"/>
    <circle cx="-34" cy="16" r="7" fill="#5a2d0c"/>
    <circle cx="8" cy="10" r="9" fill="#5a2d0c"/>
    <circle cx="32" cy="34" r="6" fill="#5a2d0c"/>
    <circle cx="-8" cy="42" r="5" fill="#5a2d0c"/>
    <!-- refresh arrows -->
    <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -88 -20 A 92 92 0 0 1 -30 -88"/>
      <path d="M -30 -100 L -26 -86 L -40 -82"/>
      <path d="M 88 20 A 92 92 0 0 1 30 88"/>
      <path d="M 30 100 L 26 86 L 40 82"/>
    </g>
  </g>

  <!-- right icon : shield + key -->
  <g transform="translate(810 190)" filter="url(#glow)">
    <path d="M 0 -84 L 66 -58 L 66 4 C 66 46 36 72 0 88 C -36 72 -66 46 -66 4 L -66 -58 Z" fill="#12163f" stroke="url(#title)" stroke-width="4"/>
    <circle cx="-14" cy="-12" r="18" fill="none" stroke="url(#gold)" stroke-width="8"/>
    <path d="M 0 -12 H 40 M 28 -12 V 4 M 40 -12 V 6" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M -34 40 L -18 56 L 22 22" fill="none" stroke="#00ffa3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',Arial,Helvetica,sans-serif" font-weight="900">
    <text x="480" y="168" font-size="104" letter-spacing="14" fill="url(#title)" filter="url(#glow)">JUWEL</text>
    <text x="480" y="168" font-size="104" letter-spacing="14" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2">JUWEL</text>
    <text x="480" y="226" font-size="42" letter-spacing="22" fill="#ffffff" fill-opacity="0.96">CHAT BOT</text>
  </g>

  <!-- divider -->
  <g transform="translate(480 252)">
    <rect x="-210" y="-1.5" width="186" height="3" rx="1.5" fill="url(#title)"/><rect x="24" y="-1.5" width="186" height="3" rx="1.5" fill="url(#title)"/>
    <path d="M 0 -8 L 8 0 L 0 8 L -8 0 Z" fill="url(#gold)"/>
  </g>

  <!-- ribbons -->
  <g font-family="'Segoe UI','Trebuchet MS',Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">
    <rect x="262" y="272" width="436" height="42" rx="21" fill="url(#ribbon)" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="480" y="300" font-size="22" letter-spacing="3" fill="#ffe27a">AUTO COOKIE  •  AUTO LOGIN</text>
    <rect x="232" y="326" width="496" height="42" rx="21" fill="url(#ribbon)" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="480" y="354" font-size="20" letter-spacing="2" fill="#bff6ff">FACEBOOK SESSION  ALWAYS  ALIVE</text>
  </g>

  <!-- bottom tag -->
  <text x="480" y="396" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" letter-spacing="5" fill="#ffffff" fill-opacity="0.55">MIRAI  +  GOAT  •  COOKIE  GUARDIAN  •  ZERO  DOWNTIME</text>

  <!-- sparkles -->
  <g fill="#ffffff">
    <circle cx="320" cy="60" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="52" r="2.4"><animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="92" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="100" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>
</svg>
